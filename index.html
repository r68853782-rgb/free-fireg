
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Action Game</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #101827;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 { color: #38bdf8; }

#game {
  width: min(95vw, 900px);
  height: auto;
  background: #182b35;
  border: 3px solid #38bdf8;
  border-radius: 10px;
  display: block;
  margin: 15px auto;
  touch-action: manipulation;
}

button {
  padding: 12px 22px;
  margin: 5px;
  border: 0;
  border-radius: 8px;
  background: #0ea5e9;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:active { transform: scale(.95); }

.info { color: #cbd5e1; }

.controls {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 8px;
  margin: 12px;
}
</style>
</head>

<body>

<h1>⚡ Ultimate Action Game ⚡</h1>
<p class="info">Move: Arrow Keys / A-D | Shoot: SPACE / FIRE</p>

<canvas id="game" width="900" height="500"></canvas>

<div class="controls">
  <button id="left">⬅ LEFT</button>
  <button id="right">RIGHT ➡</button>
  <button id="fire">🔫 FIRE</button>
  <button id="restart">🔄 RESTART</button>
</div>

<p id="score">Score: 0 | Ammo: Unlimited | Health: 100</p>
<p class="info">Enemies ko hit karo aur apna high score banao!</p>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const W = canvas.width;
const H = canvas.height;

let player, bullets, enemies, particles;
let score, health, frame, gameOver;
let keys = {};
let firing = false;
let spawnTimer = 0;

function resetGame() {
  player = {
    x: 100, y: 400, w: 38, h: 48,
    speed: 5, cooldown: 0
  };

  bullets = [];
  enemies = [];
  particles = [];
  score = 0;
  health = 100;
  frame = 0;
  spawnTimer = 0;
  gameOver = false;
}

function drawBackground() {
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, "#102438");
  sky.addColorStop(1, "#275044");

  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (let i = 0; i < 45; i++) {
    const x = (i * 137) % W;
    const y = (i * 71) % 300;
    ctx.fillStyle = "#cbd5e1";
    ctx.fillRect(x, y, 2, 2);
  }

  // Ground
  ctx.fillStyle = "#25352e";
  ctx.fillRect(0, 455, W, 45);

  ctx.strokeStyle = "#55715a";
  for (let x = 0; x < W; x += 45) {
    ctx.beginPath();
    ctx.moveTo(x, 455);
    ctx.lineTo(x - 20, 500);
    ctx.stroke();
  }
}

function drawPlayer() {
  const bob = Math.sin(frame * 0.15) * 2;

  // Animated legs
  ctx.strokeStyle = "#e2e8f0";
  ctx.lineWidth = 7;
  ctx.lineCap = "round";

  const step = Math.sin(frame * 0.2) * 5;

  ctx.beginPath();
  ctx.moveTo(player.x + 12, player.y + 30);
  ctx.lineTo(player.x + 10 + step, player.y + 44);
  ctx.moveTo(player.x + 27, player.y + 30);
  ctx.lineTo(player.x + 28 - step, player.y + 44);
  ctx.stroke();

  // Body
  ctx.fillStyle = "#22c55e";
  ctx.fillRect(player.x + 5, player.y + 10 + bob, 28, 25);

  // Head
  ctx.fillStyle = "#f4c7a1";
  ctx.beginPath();
  ctx.arc(player.x + 19, player.y + 5 + bob, 11, 0, Math.PI * 2);
  ctx.fill();

  // Helmet
  ctx.fillStyle = "#16a34a";
  ctx.beginPath();
  ctx.arc(player.x + 19, player.y + 3 + bob, 11, Math.PI, 0);
  ctx.fill();

  // Fictional game blaster
  ctx.fillStyle = "#94a3b8";
  ctx.fillRect(player.x + 23, player.y + 17 + bob, 26, 8);
  ctx.fillStyle = "#38bdf8";
  ctx.fillRect(player.x + 40, player.y + 19 + bob, 8, 4);
}

function shoot() {
  if (player.cooldown > 0 || gameOver) return;

  bullets.push({
    x: player.x + 49,
    y: player.y + 21,
    speed: 10,
    size: 5
  });

  player.cooldown = 8;

  // Muzzle flash
  for (let i = 0; i < 4; i++) {
    particles.push({
      x: player.x + 51,
      y: player.y + 21,
      vx: Math.random() * 4,
      vy: (Math.random() - 0.5) * 4,
      life: 8,
      color: "#facc15"
    });
  }
}

function spawnEnemy() {
  enemies.push({
    x: W + 20,
    y: 390 + Math.random() * 45,
    w: 35,
    h: 42,
    speed: 1.5 + Math.random() * 1.5,
    phase: Math.random() * 6
  });
}

function drawEnemy(e) {
  const bob = Math.sin(frame * 0.12 + e.phase) * 3;

  // Cartoon robot enemy
  ctx.fillStyle = "#ef4444";
  ctx.fillRect(e.x, e.y + bob, e.w, e.h);

  ctx.fillStyle = "#991b1b";
  ctx.fillRect(e.x + 4, e.y + 8 + bob, 27, 15);

  ctx.fillStyle = "#fef08a";
  ctx.fillRect(e.x + 7, e.y + 12 + bob, 6, 5);
  ctx.fillRect(e.x + 23, e.y + 12 + bob, 6, 5);

  ctx.fillStyle = "#64748b";
  ctx.fillRect(e.x + 5, e.y + 38 + bob, 9, 7);
  ctx.fillRect(e.x + 22, e.y + 38 + bob, 9, 7);
}

function makeExplosion(x, y) {
  for (let i = 0; i < 12; i++) {
    const a = Math.random() * Math.PI * 2;
    const speed = 1 + Math.random() * 4;

    particles.push({
      x, y,
      vx: Math.cos(a) * speed,
      vy: Math.sin(a) * speed,
      life: 20 + Math.random() * 10,
      color: Math.random() > 0.5 ? "#fb923c" : "#facc15"
    });
  }
}

function update() {
  if (gameOver) return;

  frame++;

  if (keys.ArrowLeft || keys.a || keys.A)
    player.x -= player.speed;

  if (keys.ArrowRight || keys.d || keys.D)
    player.x += player.speed;

  player.x = Math.max(5, Math.min(W - 60, player.x));

  if (player.cooldown > 0) player.cooldown--;
  if (firing) shoot();

  spawnTimer--;
  if (spawnTimer <= 0) {
    spawnEnemy();
    spawnTimer = Math.max(22, 65 - score / 3);
  }

  bullets.forEach(b => b.x += b.speed);
  bullets = bullets.filter(b => b.x < W + 20);

  enemies.forEach(e => {
    e.x -= e.speed;

    if (e.x < player.x + player.w &&
        e.x + e.w > player.x &&
        e.y < player.y + player.h &&
        e.y + e.h > player.y) {
      e.hit = true;
      health -= 20;
      makeExplosion(e.x, e.y);
    }

    if (e.x < -40) {
      e.hit = true;
      health -= 10;
    }
  });

  // Bullet and enemy collision
  bullets.forEach(b => {
    enemies.forEach(e => {
      if (!b.hit && !e.hit &&
          b.x > e.x && b.x < e.x + e.w &&
          b.y > e.y && b.y < e.y + e.h) {
        b.hit = true;
        e.hit = true;
        score += 10;
        makeExplosion(e.x + e.w / 2, e.y + e.h / 2);
      }
    });
  });

  bullets = bullets.filter(b => !b.hit);
  enemies = enemies.filter(e => !e.hit);

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
  });

  particles = particles.filter(p => p.life > 0);

  if (health <= 0) {
    health = 0;
    gameOver = true;
  }
}

function draw() {
  drawBackground();

  bullets.forEach(b => {
    ctx.fillStyle = "#facc15";
    ctx.shadowColor = "#facc15";
    ctx.shadowBlur = 12;
    ctx.fillRect(b.x, b.y, 14, 5);
    ctx.shadowBlur = 0;
  });

  enemies.forEach(drawEnemy);
  drawPlayer();

  particles.forEach(p => {
    ctx.globalAlpha = Math.min(1, p.life / 10);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, 5, 5);
  });
  ctx.globalAlpha = 1;

  // Health bar
  ctx.fillStyle = "#111827";
  ctx.fillRect(15, 15, 205, 22);

  ctx.fillStyle = health > 30 ? "#22c55e" : "#ef4444";
  ctx.fillRect(18, 18, health * 2, 16);

  ctx.fillStyle = "white";
  ctx.font = "bold 14px Arial";
  ctx.fillText("HEALTH: " + health, 25, 32);

  document.getElementById("score").textContent =
    "Score: " + score +
    " | Ammo: Unlimited | Health: " + health;

  if (gameOver) {
    ctx.fillStyle = "rgba(0,0,0,0.7)";
    ctx.fillRect(0, 0, W, H);

    ctx.textAlign = "center";
    ctx.fillStyle = "#f87171";
    ctx.font = "bold 46px Arial";
    ctx.fillText("GAME OVER", W / 2, H / 2 - 20);

    ctx.fillStyle = "white";
    ctx.font = "24px Arial";
    ctx.fillText("Final Score: " + score, W / 2, H / 2 + 25);
    ctx.fillText("Press RESTART to play again",
      W / 2, H / 2 + 65);

    ctx.textAlign = "left";
  }
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

document.addEventListener("keydown", e => {
  if (["ArrowLeft", "ArrowRight", " "].includes(e.key))
    e.preventDefault();

  keys[e.key] = true;
  if (e.code === "Space") firing = true;
});

document.addEventListener("keyup", e => {
  keys[e.key] = false;
  if (e.code === "Space") firing = false;
});

function holdButton(id, key) {
  const btn = document.getElementById(id);

  btn.addEventListener("pointerdown", e => {
    e.preventDefault();
    if (key === "fire") firing = true;
    else keys[key] = true;
  });

  ["pointerup", "pointerleave", "pointercancel"].forEach(event => {
    btn.addEventListener(event, () => {
      if (key === "fire") firing = false;
      else keys[key] = false;
    });
  });
}

holdButton("left", "ArrowLeft");
holdButton("right", "ArrowRight");
holdButton("fire", "fire");

document.getElementById("restart").onclick = resetGame;

resetGame();
loop();
</script>

</body>
</html>
